name: Build Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RUSTFLAGS: -Zunstable-options -Cpanic=immediate-abort

jobs:
  build:
    name: catalog (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            experimental: true
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Linux：gpui 的 x11/wayland 后端所需的系统依赖
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libfontconfig-dev \
            libasound2-dev \
            libudev-dev

      - name: Install Rust nightly with rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
          components: rust-src

      - name: Verify rust-src component
        shell: bash
        run: rustup component list --toolchain nightly --installed | grep rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # pathfinder_simd 0.5.6 的 ARM 路径使用了近期 nightly 已移除的
      # simd_minimum/maximum_number_nsz intrinsic,上游未发修复版,
      # 就地替换为等价的新名 simd_fmin/simd_fmax
      - name: Patch pathfinder_simd for recent nightly
        shell: bash
        run: |
          cargo fetch --target ${{ matrix.target }}
          sed -i.bak 's/simd_maximum_number_nsz/simd_fmax/g; s/simd_minimum_number_nsz/simd_fmin/g' \
            "$HOME/.cargo/registry/src/"*/pathfinder_simd-0.5.6/src/arm/mod.rs

      - name: Build catalog
        shell: bash
        run: >
          cargo +nightly build --release --target ${{ matrix.target }} -p catalog
          -Z build-std=std,core
          -Z build-std-features=default,optimize_for_size

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/catalog*
          if-no-files-found: error
