[package]
name = "material3-gpui"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0 license"
description = "material design 3 components for gpui"
repository = "https://github.com/TNTyep520/md3-gpui"

[features]
dynamic-color = ["dep:mcu-hct", "dep:mcu-palettes", "dep:mcu-dynamiccolor"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
anyhow = "1"
mcu-hct = { version = "0.2.1", optional = true }
mcu-palettes = { version = "0.2.0", optional = true }
mcu-dynamiccolor = { version = "0.2.4", optional = true }

[dev-dependencies]
# demo 示例需要平台启动层（zed 已将后端拆分为 gpui_platform）
# x11/wayland/font-kit/runtime_shaders 均为目标平台门控 feature
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }

# Windows 目标的 exe 图标嵌入(build.rs 内按 CARGO_CFG_TARGET_OS 守卫;
# crate 本体跨平台,无条件声明——build 脚本按宿主平台编译,不能按目标门控)
[build-dependencies]
winresource = "0.1"

# macOS 目标的 demo 专用:经 AppKit 隐藏绿色最大化红绿灯(gpui 未暴露
# 单灯显隐,objc2 绑定为安全方法;实现见 examples/demo/main.rs)
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSEnumerator",
] }

[[example]]
name = "demo"

[lints.clippy]
redundant_clone = "warn"

[profile.dev]
panic = "abort"
debug = "limited"
split-debuginfo = "unpacked"
incremental = true

[profile.dev.package]
taffy = { opt-level = 3 }

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
rpath = false

[profile.release-fast]
inherits = "release"
opt-level = "z"
strip = true
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
